if(key==='intro')screen.innerHTML=`<div class="step-label">STEP 1 · PRE-READING · 2 MIN</div><h2>Look at the picture</h2><p class="lead">What do you think happened to the lion?</p><img class="scene" src="${pictures.trapped}" alt="A lion is caught in a net and a mouse is nearby."><div class="choice-list" id="prediction"><button class="choice" onclick="selectPrediction(this)">The lion is playing with the mouse.</button><button class="choice" onclick="selectPrediction(this)">The lion is caught in a net.</button><button class="choice" onclick="selectPrediction(this)">The lion is sleeping under a tree.</button></div><p class="hint">There is no score here. Make your best guess before reading.</p><div class="actions"><span></span><button class="btn" onclick="go(1)">Start reading →</button></div>`;
if(key==='story1')screen.innerHTML=`<div class="step-label">STEP 2 · STORY READING · PAGE 1 OF 2</div><h2>A Lion in Trouble</h2><img class="scene" src="${pictures.trapped}" alt="A lion caught in a rope net while a mouse looks at him."><div class="story-text">${sentence('One day, a lion walked through the forest.')}${sentence("Suddenly, a hunter's net fell over him.")}${sentence('The lion was caught. He could not get out.')}${sentence('A little mouse heard the lion and came to help.')}</div><button class="audio" onclick="speak(\"One day, a lion walked through the forest. Suddenly, a hunter's net fell over him. The lion was caught. He could not get out. A little mouse heard the lion and came to help.\")">🔊 Listen to this page</button><div class="actions"><button class="btn secondary" onclick="go(0)">← Back</button><button class="btn" onclick="go(2)">Next page →</button></div>`;
if(key==='look2')screen.innerHTML=`<div class="step-label">STEP 3 · LOOK & GUESS · 1 MIN</div><h2>What will the mouse do?</h2><p class="lead">Look carefully at the second picture. How do you think the mouse will help the lion?</p><img class="scene" src="${pictures.helping}" alt="A little mouse is biting the ropes of the net around the lion."><div class="choice-list" id="prediction2"><button class="choice" onclick="selectPrediction2(this)">The mouse will bite the ropes.</button><button class="choice" onclick="selectPrediction2(this)">The mouse will call another lion.</button><button class="choice" onclick="selectPrediction2(this)">The mouse will run away.</button></div><p class="hint">Use the picture to make a prediction. You will find out what happens on the next page.</p><div class="actions"><button class="btn secondary" onclick="go(1)">← Previous page</button><button class="btn" onclick="go(3)">Read and find out →</button></div>`;
if(key==='story2')screen.innerHTML=`<div class="step-label">STEP 4 · STORY READING · PAGE 2 OF 2</div><h2>A Small Helper</h2><img class="scene" src="${pictures.helping}" alt="A little mouse bites the ropes of the net to free the lion."><div class="story-text">${sentence('“I can help you,” said the mouse.')}${sentence('The mouse bit the ropes with his small teeth.')}${sentence('He worked hard, and the net began to break.')}${sentence('Soon, the lion was free. “Thank you, little friend!” he said.')}${sentence('The lion learned that even a small friend can help.')}</div><button class="audio" onclick="speak('I can help you, said the mouse. The mouse bit the ropes with his small teeth. He worked hard, and the net began to break. Soon, the lion was free. Thank you, little friend, he said. The lion learned that even a small friend can help.')">🔊 Listen to this page</button><div class="actions"><button class="btn secondary" onclick="go(2)">← Look & Guess</button><button class="btn" onclick="go(4)">Learn words →</button></div>`;
if(key==='vocab')screen.innerHTML=`<div class="step-label">STEP 5 · VOCABULARY · 2 MIN</div><h2>Words from the Story</h2><p class="lead">Read each word and its meaning. Press the speaker to hear it.</p><div class="vocab-grid">${word('net','그물','Something used to catch animals or fish.','The lion was caught in a net.')}${word('hunter','사냥꾼','A person who hunts animals.',"A hunter's net fell over him.")}${word('caught','잡힌','Unable to get away.','The lion was caught.')}${word('rope','밧줄','A thick, strong string.','The mouse bit the ropes.')}${word('bite','물다','To cut or hold something with your teeth.','The mouse bit the ropes.')}${word('free','자유로운, 풀려난','Not caught or held.','Soon, the lion was free.')}</div><div class="actions"><button class="btn secondary" onclick="go(3)">← Story</button><button class="btn" onclick="go(5)">Check understanding →</button></div>`;
if(key==='quiz')renderQuiz();if(key==='write')screen.innerHTML=`<div class="step-label">STEP 7 · MY WRITING · 2 MIN</div><h2>What did you learn?</h2><p class="lead">Write one or two sentences about the story. Use the sentence starter if you need help.</p><div class="story-text" style="font-size:18px">I learned that __________________________.</div><p class="hint">You can write about kindness, friendship, or helping others.</p><textarea id="myWriting" placeholder="I learned that ...">${localStorage.getItem('lionMouseWriting')||''}</textarea><div class="actions"><button class="btn secondary" onclick="go(5)">← Quiz</button><button class="btn" onclick="submitWriting()">Finish writing →</button></div><div id="writingResult" class="writing-result"></div>`;if(key==='finish')renderFinish()}
function sentence(t){return `<span class="sentence"><button class="audio" onclick="speak(${JSON.stringify(t).replace(/</g,'\\u003c')})">🔊</button>${t}</span>`}
function word(w,m,d,e){return `<article class="word-card"><div class="word">${w} <button class="audio" onclick="speak('${w}')">🔊</button></div><div class="meaning">${m}</div><div class="definition">${d}</div><div class="hint">${e}</div><button class="audio" onclick="speak('${w}. ${d}. Example: ${e}')">Listen to example</button></article>`}
function selectPrediction(el){document.querySelectorAll('#prediction .choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
function selectPrediction2(el){document.querySelectorAll('#prediction2 .choice').forEach(b=>b.classList.remove('selected'));el.classList.add('selected')}
const questions=[{q:'What happened to the lion?',opts:['He fell into a river.','He was caught in a net.','He lost his way.'],a:1,why:"A hunter's net fell over the lion, and he could not get out."},{q:'Who came to help the lion?',opts:['A little mouse','A hunter','Another lion'],a:0,why:'A little mouse heard the lion and came to help.'},{q:'How did the mouse help?',opts:['He called the hunter.','He pulled the lion away.','He bit the ropes.'],a:2,why:'The mouse bit the ropes with his small teeth.'},{q:'What is one lesson of the story?',opts:['Small friends can help.','Only big animals are strong.','Never walk in a forest.'],a:0,why:'The lion learned that even a small friend can help.'}];
function renderQuiz(){screen.innerHTML=`<div class="step-label">STEP 6 · READING CHECK · 3 MIN</div><h2>Check Your Understanding</h2><p class="lead">Choose the best answer for each question.</p><div id="questions"></div><div class="actions"><button class="btn secondary" onclick="go(4)">← Vocabulary</button><button class="btn" id="checkQuiz" onclick="checkQuiz()">Check answers</button></div><div id="quizResult" class="feedback"></div>`;let h=document.getElementById('questions');questions.forEach((q,i)=>h.innerHTML+=`<section style="padding:15px 0;border-bottom:1px solid var(--line)"><strong>${i+1}. ${q.q}</strong><div class="choice-list">${q.opts.map((o,j)=>`<button class="choice" id="q${i}o${j}" onclick="pick(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div class="feedback" id="why${i}"></div></section>`)}
function pick(i,j){if(quizSubmitted)return;answers[i]=j;questions[i].opts.forEach((_,k)=>document.getElementById(`q${i}o${k}`).classList.toggle('selected',j===k))}
function checkQuiz(){if(Object.keys(answers).length<questions.length){let r=document.getElementById('quizResult');r.textContent='Please answer all four questions first.';r.classList.add('show');return}quizSubmitted=true;let score=0;questions.forEach((q,i)=>{let ok=answers[i]===q.a;if(ok)score++;let b=document.getElementById(`q${i}o${answers[i]}`);b.classList.add('selected');let box=document.getElementById(`why${i}`);box.textContent=(ok?'Correct! ':'Not quite. ')+q.why;box.classList.add('show')});localStorage.setItem('lionMouseScore',score);let r=document.getElementById('quizResult');r.textContent=`Your score: ${score} / ${questions.length}. Read the explanations, then continue to writing.`;r.classList.add('show');let b=document.getElementById('checkQuiz');b.textContent='Continue to writing';b.onclick=()=>go(6)}
function submitWriting(){let v=document.getElementById('myWriting').value.trim();if(!v){alert('Please write at least one sentence.');return}localStorage.setItem('lionMouseWriting',v);let box=document.getElementById('writingResult');box.innerHTML='<strong>Good work!</strong><br>Your idea: '+escapeHtml(v)+'<br><br><span class="hint">Writing tip: Check that your sentence begins with a capital letter and ends with a period.</span>';box.classList.add('show');let b=document.querySelector('#screen .actions .btn:not(.secondary)');b.textContent='See my result →';b.onclick=()=>go(7)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderFinish(){let score=localStorage.getItem('lionMouseScore'),writing=localStorage.getItem('lionMouseWriting')||'';screen.innerHTML=`<div class="step-label">LESSON COMPLETE</div><h2>Well done, reader!</h2><p class="lead">You finished The Lion and the Mouse.</p><div class="story-text" style="text-align:center"><div style="font-size:42px">🦁 🐭</div><strong>Your quiz score: ${score===null?'Not recorded':score+' / 4'}</strong><p style="font-size:16px">“Even a small friend can help.”</p></div><h3>My writing</h3><p>${escapeHtml(writing)}</p><p class="hint">Remember: kindness and help can come from anyone.</p><div class="actions"><button class="btn secondary" onclick="go(0)">Read again</button><button class="btn" onclick="window.print()">Print my work</button></div>`}render(0);
</script></body></html>
